name: Discord notifications

on:
  workflow_call:
    inputs:
      result:
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true

permissions:
  actions: read

jobs:
  notify:
    name: Notify Discord
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Send workflow result
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RESULT: ${{ inputs.result }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret"
            exit 1
          fi

          python3 - <<'PY' > "$RUNNER_TEMP/discord-notification.json"
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          request = Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urlopen(request, timeout=10) as response:
              run = json.load(response)
          run["conclusion"] = os.environ["WORKFLOW_RESULT"]
          icon = {"success": "✅", "failure": "❌", "cancelled": "⏹️"}.get(run["conclusion"], "⚠️")
          started = datetime.fromisoformat(run.get("run_started_at") or run["created_at"])
          finished = datetime.now(timezone.utc)
          minutes, seconds = divmod(max(0, int((finished - started).total_seconds())), 60)
          actor = (run.get("triggering_actor") or run["actor"])["login"]
          branch = run.get("head_branch") or run["head_sha"][:12]
          content = "\n".join([
              f"{icon} **{run['repository']['full_name']} — {run['name'][:160]}**",
              f"Status: {run['conclusion']} · Branch: {branch[:120]}",
              f"Commit: `{run['head_sha'][:12]}` · Triggered by: {actor}",
              f"Duration: {minutes}m {seconds}s · Attempt: {run['run_attempt']}",
              run["html_url"],
          ])
          print(json.dumps({"content": content, "allowed_mentions": {"parse": []}}))
          PY

          curl --fail --silent --show-error \
            --retry 3 --retry-max-time 45 \
            --connect-timeout 5 --max-time 15 \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/discord-notification.json" \
            --url-query wait=true \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL"
