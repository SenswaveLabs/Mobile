name: Discord notifications

on:
  workflow_run:
    workflows:
      - "Mobile CI and Next Dev Proposal"
      - "Build Android"
    types: [completed]

permissions: {}

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send workflow result
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret"
            exit 1
          fi

          python3 - <<'PY' > "$RUNNER_TEMP/discord-notification.json"
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          run = event["workflow_run"]
          icon = {"success": "✅", "failure": "❌", "cancelled": "⏹️"}.get(run["conclusion"], "⚠️")
          started = datetime.fromisoformat(run.get("run_started_at") or run["created_at"])
          finished = datetime.fromisoformat(run["updated_at"])
          minutes, seconds = divmod(max(0, int((finished - started).total_seconds())), 60)
          actor = (run.get("triggering_actor") or run["actor"])["login"]
          branch = run.get("head_branch") or run["head_sha"][:12]
          content = "\n".join([
              f"{icon} **{event['repository']['full_name']} — {run['name'][:160]}**",
              f"Status: {run['conclusion']} · Branch: {branch[:120]}",
              f"Commit: `{run['head_sha'][:12]}` · Triggered by: {actor}",
              f"Duration: {minutes}m {seconds}s · Attempt: {run['run_attempt']}",
              run["html_url"],
          ])
          print(json.dumps({"content": content, "allowed_mentions": {"parse": []}}))
          PY

          curl --fail --silent --show-error \
            --retry 3 --retry-max-time 45 \
            --connect-timeout 5 --max-time 15 \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/discord-notification.json" \
            --url-query wait=true \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL"
