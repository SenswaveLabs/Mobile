name: Mobile CI and Next Dev Proposal

on:
    workflow_dispatch:
    push:
        branches:
            - next-dev
    pull_request:
        branches:
            - next-dev

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: 🏗 Setup repo
              uses: actions/checkout@v4

            - name: 🏗 Setup pnpm
              uses: pnpm/action-setup@v4

            - name: 🏗 Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: 📦 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: 🚀 Run ESLint
              run: pnpm lint

            - name: 🚀 Check TypeScript
              run: pnpm typecheck

            - name: Verify build configuration
              run: pnpm test:build

            - name: Test native auth flows
              run: pnpm test:poc

    build:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 100
        needs: quality
        steps:
            - name: 🏗 Setup repo
              uses: actions/checkout@v4

            - name: 🏗 Setup pnpm
              uses: pnpm/action-setup@v4

            - name: 🏗 Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗 Configure build environment
              run: cp .env.template .env

            - name: 🚀 Verify production Android JS bundle
              run: pnpm exec expo export --platform android

            - name: 🏗 Generate Android project
              run: pnpm exec expo prebuild --platform android --no-install

            - name: 🏗 Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: ⚡ Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: false

            # shortcut: PRs verify ARM64 debug and production JS; validate release tasks and all ABIs before releases.
            - name: 🚀 Verify Android ARM64 compilation
              working-directory: android
              run: |
                  ./gradlew :app:assembleDebug \
                    -PreactNativeArchitectures=arm64-v8a \
                    --build-cache \
                    --parallel \
                    --no-daemon \
                    --profile \
                    --console=plain

            - name: 📊 Upload Gradle profile
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: gradle-profile
                  path: android/build/reports/profile/

    propose-infra:
        name: Request Infrastructure Release Proposal
        needs: quality
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/next-dev'
        runs-on: ubuntu-latest
        steps:
            - name: Create infrastructure dispatch token
              id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ vars.MOBILE_INFRA_APP_ID }}
                  private-key: ${{ secrets.MOBILE_INFRA_APP_PRIVATE_KEY }}
                  owner: SenswaveLabs
                  repositories: Next-Infra
                  permission-actions: write

            - name: Request private infrastructure proposal
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  SOURCE_RUN_ID: ${{ github.run_id }}
              run: |
                  set -euo pipefail
                  gh workflow run propose-next-dev-mobile.yaml --repo SenswaveLabs/Next-Infra \
                    --ref main -f source_run_id="$SOURCE_RUN_ID"
                  printf 'Requested infrastructure PR for [Mobile CI](%s).\n' \
                    "https://github.com/SenswaveLabs/Mobile/actions/runs/$SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
